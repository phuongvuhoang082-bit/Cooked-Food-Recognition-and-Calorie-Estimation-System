<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to CaloLens and track the nutrition in your meals.">
  <title>Sign In | CaloLens</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <section class="auth-view" id="login-view" aria-labelledby="login-title" aria-hidden="false">
      <h1 id="login-title">Log In</h1>

      <form class="login-form" action="#" method="post">
        <div class="field">
          <label for="login-email">Email</label>
          <div class="field-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.7" />
              <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="name@email.com" required>
          </div>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="field-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="8" cy="15" r="4" stroke="currentColor" stroke-width="1.7" />
              <path d="m11 12 8-8m-3 3 3 3m-6 0 3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input class="password-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="password-toggle" type="button" aria-label="Show password" aria-controls="login-password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.7" />
                <path class="eye-slash" d="m4 20 16-16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#forgot-password">Forgot password?</a>
        </div>

        <button class="submit-button" type="submit">Sign In</button>
      </form>
      <p class="form-message" id="login-message" role="status" aria-live="polite" hidden></p>

      <p class="signup">Don't have an account? <button class="text-button" type="button" id="show-signup">Create an account</button></p>
    </section>

    <section class="auth-view" id="signup-view" aria-labelledby="signup-title" aria-hidden="true" inert>
      <h1 id="signup-title">Create Account</h1>

      <form class="signup-form" action="#" method="post">
        <div class="field">
          <label for="signup-name">Full name</label>
          <div class="field-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7" />
              <path d="M5 20c.5-3.3 3.1-5.2 7-5.2s6.5 1.9 7 5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
            <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
          </div>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <div class="field-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.7" />
              <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@email.com" required>
          </div>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <div class="field-input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="8" cy="15" r="4" stroke="currentColor" stroke-width="1.7" />
              <path d="m11 12 8-8m-3 3 3 3m-6 0 3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input class="password-input" id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required>
            <button class="password-toggle" type="button" aria-label="Show password" aria-controls="signup-password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.7" />
                <path class="eye-slash" d="m4 20 16-16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>

        <button class="submit-button" type="submit">Create Account</button>
      </form>
      <p class="form-message" id="signup-message" role="status" aria-live="polite" hidden></p>

      <p class="signup">Already have an account? <button class="text-button" type="button" id="show-login">Sign in</button></p>
    </section>
  </main>

</body>
</html>
